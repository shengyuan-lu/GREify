<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GREify</title>
  <style>
    :root {
      --primary-color: #2196F3;
      --text-color: #222;
      --muted-color: #666;
      --background-light: #f9f9f9;
      --border-color: #ccc;
      --accent-bg: #e8f5e9;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      margin: 0;
      padding: 16px;
      background: #fff;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 300px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      color: var(--primary-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
      cursor: pointer;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary-color);
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .stepper-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stepper-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      flex-grow: 1;
    }

    .stepper-buttons {
      display: flex;
      gap: 6px;
    }

    .stepper-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border-color);
      background-color: var(--background-light);
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .stepper-button:hover {
      background-color: #e0e0e0;
    }

    .status {
      padding: 12px;
      background-color: var(--accent-bg);
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    .word-count {
      font-weight: bold;
      color: var(--primary-color);
    }

    .info {
      font-size: 13px;
      color: var(--muted-color);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>GREify</h1>

  <div class="form-group">
    <label for="extension-active">Enable GRE Vocabulary Replacement</label>
    <div class="toggle-container">
      <label class="toggle-switch">
        <input type="checkbox" id="extension-active" />
        <span class="slider"></span>
      </label>
      <span id="toggle-status">Off</span>
    </div>
  </div>

  <div class="form-group">
    <label for="replacement-percentage">Replacement Percentage</label>
    <div class="stepper-container">
      <div class="stepper-value" id="percentage-value">25%</div>
      <div class="stepper-buttons">
        <button class="stepper-button" id="decrease-percentage">−</button>
        <button class="stepper-button" id="increase-percentage">+</button>
      </div>
    </div>
  </div>

  <div class="status" id="status-message">
    <div id="word-count-container" style="display: none;">
      <span class="word-count" id="word-count">0</span> words replaced on this page
    </div>
    <div id="status-text">
      Click a highlighted word to see its definition
    </div>
  </div>

  <div class="info">
    <p>Some websites may not work correctly with this extension. If you experience issues, try disabling it.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
